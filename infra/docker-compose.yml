# ============================================================
# CampusShield — Docker Compose (Full Stack)
#
# Usage:
#   cp .env.example .env   # then edit .env with real secrets
#   docker compose -f infra/docker-compose.yml up --build
#
# Or from repo root:
#   docker compose -f infra/docker-compose.yml up --build
# ============================================================

name: campus-shield

services:
  # --------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4
  # --------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-campusshield}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically run the init migration on first start
      - ../infra/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-campusshield} -d ${POSTGRES_DB:-campusshield}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cs-network

  # --------------------------------------------------------
  # Redis 7 (BullMQ job queue & caching)
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - cs-network

  # --------------------------------------------------------
  # API Server (Fastify + Socket.IO + BullMQ)
  # --------------------------------------------------------
  api-server:
    build:
      context: ../services/api-server
      dockerfile: Dockerfile
    container_name: cs-api-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-campusshield}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-campusshield}
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-3001}
      API_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
      GRACE_PERIOD_SECONDS: ${GRACE_PERIOD_SECONDS:-60}
      DEFAULT_CHECKIN_INTERVAL_HOURS: ${DEFAULT_CHECKIN_INTERVAL_HOURS:-48}
      CHECKIN_REMINDER_HOURS_BEFORE: ${CHECKIN_REMINDER_HOURS_BEFORE:-4,1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cs-network

  # --------------------------------------------------------
  # University Panel (Next.js Staff Dashboard)
  # --------------------------------------------------------
  university-panel:
    build:
      context: ../apps/university-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    container_name: cs-university-panel
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cs-network

# --------------------------------------------------------
# Named Volumes
# --------------------------------------------------------
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# --------------------------------------------------------
# Network
# --------------------------------------------------------
networks:
  cs-network:
    driver: bridge
